<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Website</title>
  <style>
    /* Basic reset */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f4f4f4; color: #333; }

    /* Header */
    header {
      background: #fff;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    header img { height: 60px; }

    /* Hero section */
    .hero {
      text-align: center;
      padding: 80px 20px;
      background: #e0f7fa;
    }
    .hero h1 { font-size: 2.5rem; margin-bottom: 20px; }
    .hero p { font-size: 1.2rem; margin-bottom: 40px; }

    /* Mockup gallery */
    .mockups {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
    }
    .mockups img {
      width: 300px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
      transition: transform 0.3s;
    }
    .mockups img:hover { transform: scale(1.05); }

    /* Footer */
    footer {
      text-align: center;
      padding: 20px;
      background: #222;
      color: #fff;
    }
  </style>
</head>
<body>

  <!-- Header with Logo -->
  <header>
    <img src="logo.png" alt="Your Logo">
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to Your Website</h1>
    <p>Here’s a preview of your amazing work!</p>
  </section>

  <!-- Mockup Gallery -->
  <section class="mockups">
    <img src="mockup1.png" alt="Website Mockup 1">
    <img src="mockup2.png" alt="Website Mockup 2">
    <img src="mockup3.png" alt="Website Mockup 3">
    <!-- Add more mockups if needed -->
  </section>

  <!-- Footer -->
  <footer>
    &copy; 2025 Your Company. All rights reserved.
  </footer>

</body>
</html>
